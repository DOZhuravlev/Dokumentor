# .swiftlint.yml

included:
  - "Projects"
  - "Documentor"

excluded:
  - "**/Generated"
  - "**/*.gen.swift"
  - "**/Build"
  - "**/.tuist-bin"

indentation: 4
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
type_body_length:
  warning: 500
  error: 800
file_length:
  warning: 600
  error: 1200
function_body_length:
  warning: 80
  error: 150

disabled_rules:
  - trailing_whitespace
  - cyclomatic_complexity
  - todo
  - force_cast
  - force_try

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - nimble_operator
  - implicit_return
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - closure_end_indentation
  - identical_operands
  - unused_import

identifier_name:
  min_length: 2
  excluded: ["id", "x", "y", "dx", "dy", "at", "to", "in"]

reporter: "xcode"
